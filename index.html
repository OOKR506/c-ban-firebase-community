<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🎓 c반놈들</title>

  <!-- PWA: 홈 화면에 추가했을 때 앱처럼(standalone) 열리도록 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="c반놈들">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Noto Sans KR',sans-serif;}
    /* 모바일에서 특정 화면(게시판/채팅/투표 등)의 긴 텍스트·URL이 줄바꿈 없이
       뷰포트보다 넓게 그려지면, 브라우저가 페이지 전체를 축소해서
       PC(데스크톱) 레이아웃처럼 보이는 현상이 생깁니다.
       아래 규칙으로 어떤 화면에서도 가로로 넘치지 않게 강제 고정합니다. */
    html, body { max-width: 100%; overflow-x: hidden; }
    #app, #main-content, #content { max-width: 100%; overflow-x: hidden; }
    * { overflow-wrap: break-word; word-break: break-word; }
    img, video, canvas, svg { max-width: 100%; height: auto; }
    pre, code { white-space: pre-wrap; overflow-wrap: anywhere; }

    .animate-fade-in{animation:fadeIn .3s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .no-scrollbar::-webkit-scrollbar{display:none;width:0;height:0;}
    .sidebar-collapsed{width:60px!important;}
    .sidebar-collapsed .nav-text{display:none;}
    .sidebar-collapsed .sidebar-header{padding:12px!important;}
    .sidebar-collapsed .sidebar-logo-text{display:none;}
    /* iOS 노치/홈 인디케이터 안전영역 확보 (standalone 실행 시) */
    body{padding-bottom:env(safe-area-inset-bottom);}
    header.sticky{padding-top:env(safe-area-inset-top);}
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="app" class="flex min-h-screen">
    <!-- 사이드바 (PC) -->
    <aside id="sidebar" class="hidden lg:flex w-64 bg-white border-r border-slate-200 flex-col fixed h-full z-40 transition-all duration-300">
      <div class="p-6 border-b border-slate-200 sidebar-header">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-2xl text-white shadow-lg cursor-pointer" onclick="toggleSidebar()">🎓</div>
          <div class="sidebar-logo-text"><h1 class="font-bold text-lg text-slate-800">c반놈들</h1><p class="text-xs text-slate-500">멤버 <span id="member-count-sidebar">0</span>명</p></div>
        </div>
      </div>
      <div id="sidebar-login-area" class="p-4 border-b border-slate-200">
        <button onclick="showLoginModal()" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-medium hover:shadow-lg">로그인</button>
      </div>
      <nav class="flex-1 p-4 overflow-y-auto">
        <ul class="space-y-1">
          <li><button onclick="showView('home')" id="nav-home" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md"><span class="text-xl">🏠</span><span class="font-medium nav-text">홈</span></button></li>
          <li><button onclick="showView('board')" id="nav-board" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">📋</span><span class="font-medium nav-text">게시판</span></button></li>
          <li><button onclick="showView('chat')" id="nav-chat" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">💬</span><span class="font-medium nav-text">채팅</span></button></li>
          <li><button onclick="showView('poll')" id="nav-poll" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">📊</span><span class="font-medium nav-text">투표</span></button></li>
          <li><button onclick="showView('dday')" id="nav-dday" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">📅</span><span class="font-medium nav-text">D-Day</span></button></li>
          <li><button onclick="showView('game')" id="nav-game" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">🎰</span><span class="font-medium nav-text">미니게임</span></button></li>
          <li><button onclick="showView('members')" id="nav-members" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100"><span class="text-xl">👥</span><span class="font-medium nav-text">멤버</span></button></li>
          <li><button onclick="showNotifications()" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-slate-600 hover:bg-slate-100 relative"><span class="text-xl">🔔</span><span class="font-medium nav-text">알림</span><span id="notif-badge" class="hidden absolute right-3 top-3 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span></button></li>
        </ul>
        <div id="admin-menu-sidebar" class="hidden mt-4 pt-4 border-t border-slate-200">
          <p class="text-xs text-slate-400 font-medium mb-2 px-2">관리자</p>
          <button onclick="showView('admin')" id="nav-admin" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-red-600 hover:bg-red-50"><span class="text-xl">👑</span><span class="font-medium nav-text">관리자</span></button>
        </div>
      </nav>
    </aside>

    <!-- 메인 -->
    <main id="main-content" class="flex-1 lg:ml-64 pb-20 lg:pb-8 transition-all duration-300">
      <header class="lg:hidden sticky top-0 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-30">
        <div class="flex items-center gap-2"><span class="text-2xl">🎓</span><h1 class="font-bold text-lg text-slate-800">c반놈들</h1></div>
        <div class="flex items-center gap-3">
          <button onclick="showNotifications()" class="p-2 hover:bg-slate-100 rounded-full relative"><span class="text-xl">🔔</span><span id="notif-badge-mobile" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span></button>
          <button id="mobile-profile-btn" onclick="showLoginModal()" class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-lg">👤</button>
        </div>
      </header>
      <div id="content" class="p-4 lg:p-6">
        <div class="flex items-center justify-center h-64">
          <div class="text-center">
            <div class="text-4xl mb-4">🎓</div>
            <p class="text-slate-500">로딩 중...</p>
          </div>
        </div>
      </div>
      <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-1 py-2 z-30">
        <div class="flex justify-around">
          <button onclick="showView('home')" id="mobile-nav-home" class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl bg-indigo-50 text-indigo-600"><span class="text-lg">🏠</span><span class="text-xs font-medium">홈</span></button>
          <button onclick="showView('board')" id="mobile-nav-board" class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500"><span class="text-lg">📋</span><span class="text-xs font-medium">게시판</span></button>
          <button onclick="showView('chat')" id="mobile-nav-chat" class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500"><span class="text-lg">💬</span><span class="text-xs font-medium">채팅</span></button>
          <button onclick="showView('game')" id="mobile-nav-game" class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500"><span class="text-lg">🎰</span><span class="text-xs font-medium">게임</span></button>
          <button onclick="showProfileMenu()" class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500"><span class="text-lg">👤</span><span class="text-xs font-medium">MY</span></button>
        </div>
      </nav>
    </main>
  </div>
  <div id="modal-container" class="hidden fixed inset-0 z-50"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=20261110b"></script>
  <script src="firebase-safe.js?v=20261110b"></script>
  <script src="firebase-auth.js?v=20261110b"></script>
  <script src="firebase-badwords.js?v=20261110b"></script>
  <script src="firebase-posts.js?v=20261110b"></script>
  <script src="firebase-comments.js?v=20261110b"></script>
  <script src="firebase-userdata.js?v=20261110b"></script>
  <script src="firebase-chat.js?v=20261110b"></script>
  <script src="firebase-admin.js?v=20261110b"></script>
  <script src="firebase-notifications.js?v=20261110b"></script>
  <script src="firebase-dm.js?v=20261110b"></script>
  <script src="firebase-poll.js?v=20261110b"></script>
  <script src="firebase-dday.js?v=20261110b"></script>
  <script src="firebase-minigame.js?v=20261110b"></script>
  <script src="firebase-follow.js?v=20261110b"></script>
  <script src="app-firebase.js?v=20261110b"></script>
  <script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js?v=5').catch(function(e){console.warn('SW 등록 실패:', e);});
    });
  }
  function toggleSidebar(){
    const sb=document.getElementById('sidebar'),mc=document.getElementById('main-content');
    sb.classList.toggle('sidebar-collapsed');
    mc.style.marginLeft=sb.classList.contains('sidebar-collapsed')?'60px':'256px';
  }
  // 카테고리 드래그 스크롤
  let _catDrag=false,_catStartX=0,_catScrollL=0;
  function catDragStart(e){const el=document.getElementById('cat-scroll');if(!el)return;_catDrag=true;_catStartX=e.pageX-el.offsetLeft;_catScrollL=el.scrollLeft;el.style.cursor='grabbing';}
  function catDragMove(e){if(!_catDrag)return;e.preventDefault();const el=document.getElementById('cat-scroll');if(!el)return;const x=e.pageX-el.offsetLeft;el.scrollLeft=_catScrollL-( x-_catStartX);}
  function catDragEnd(){_catDrag=false;const el=document.getElementById('cat-scroll');if(el)el.style.cursor='grab';}
  </script>
  <style>#cat-scroll::-webkit-scrollbar{display:none;height:0;width:0;}</style>
</body>
</html>
